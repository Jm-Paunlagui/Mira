[test]
# Global hooks (pool shutdown, metrics persistence) — see test/helpers/setup.ts.
preload = ["./test/helpers/setup.ts"]
coverageSkipTestFiles = true
# Coverage scope = everything Mira ships under src/; message catalogs are templates, not logic.
coveragePathIgnorePatterns = [
  "src/shared/messages/**",
  "test/**",
  # Migration and table files the tests write to the OS temp directory and import.
  "**/mira-mig-*/**",
  "**/mira-tt-*/**",
]
coverageThreshold = { lines = 1.0, functions = 1.0 }
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
