name: CI

# Every push and pull request: type-check and build the npm package, then run the
# full test suite, the simulation and a Node smoke test against a live Oracle
# Database Free (23ai) container, in node-oracledb Thin mode and in Thick mode.
# 2.0.0 was only tested in Thin mode; 2.0.1's three defects showed up in Thick.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # What npm would publish (prepack rebuilds dist/).
      - run: npm pack --dry-run

  windows:
    # CATHERINE runs on Windows under Bun, in Thick mode, as a compiled executable.
    # GitHub's Windows runners cannot run the Oracle service container, so this job
    # covers what needs no database: type-check, unit tests (and the test runner's
    # Windows paths), loading Thick mode, and a compiled executable loading it from
    # binaryDir. The database suites on Windows are run by hand (docs/HANDOVER-WINDOWS.md).
    name: Windows (Bun, Thick load, compiled executable)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      # The unit tests open no connection; fromEnv() still wants the variables.
      MIRA_DB_USER: ci
      MIRA_DB_PASSWORD: ci
      MIRA_DB_CONNECT_STRING: 127.0.0.1:1/NONE
      MIRA_SKIP_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      - name: Unit tests (and the scorecard's categories)
        run: |
          bun run test:unit | tee unit.log
          # test/run.ts once split the file path on "/" only, so on Windows every test was "unknown".
          grep -q "│ unit " unit.log || { echo "scorecard has no 'unit' category"; exit 1; }

      - name: Install Oracle Instant Client (Windows)
        shell: pwsh
        run: |
          # Pinned build + checksum (the unversioned "latest" link is rebuilt in place).
          Invoke-WebRequest -Uri https://download.oracle.com/otn_software/nt/instantclient/2326100/instantclient-basiclite-windows.x64-23.26.1.0.0.zip -OutFile "$env:RUNNER_TEMP\ic.zip"
          $sum = (Get-FileHash "$env:RUNNER_TEMP\ic.zip" -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne "db791e42a578337cae9293a5bde33b09933e365440f3d0b542eee422a0082ec0") { throw "Instant Client checksum mismatch: $sum" }
          Expand-Archive "$env:RUNNER_TEMP\ic.zip" -DestinationPath C:\oracle
          $ic = (Get-ChildItem C:\oracle -Directory -Filter "instantclient_*" | Select-Object -First 1).FullName
          "IC_DIR=$ic" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Thick mode loads (libDir)
        run: |
          bun -e 'const m = require("./src"); m.configureDriver({ mode: "thick", libDir: process.env.IC_DIR }); const i = m.initDriver(); console.log(i); if (i.mode !== "thick") process.exit(1); process.exit(0);'

      - name: Compiled executable loads Thick mode (binaryDir)
        run: |
          bun build .github/windows/exe-smoke.ts --compile --outfile dist-exe/exe-smoke.exe
          mkdir -p dist-exe/node_modules/oracledb/build/Release
          cp node_modules/oracledb/build/Release/*win32-x64.node dist-exe/node_modules/oracledb/build/Release/
          # Run from elsewhere so nothing resolves against the repo; it must exit by itself.
          cd "$RUNNER_TEMP" && timeout 60 "$GITHUB_WORKSPACE/dist-exe/exe-smoke.exe"

  test:
    name: Oracle 23ai (${{ matrix.driver }} mode, ${{ matrix.connect }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        driver: [thin, thick]
        # failover: the TNS descriptor 2.x always used (dedicated server, SELECT failover, whose
        #   transparent reconnect can hide a dead session). easy: plain Easy Connect, as most 3.0
        #   apps will connect; a Thick-mode call timeout there really closes the session.
        connect: [failover, easy]
    services:
      oracle:
        # Pinned by digest (the tag moves); refresh with `docker buildx imagetools inspect gvenzl/oracle-free:23-slim-faststart`.
        image: gvenzl/oracle-free:23-slim-faststart@sha256:cebd977833411a42170777d8e9ccf616a028a2bb137ae96498354ab6c7510268
        env:
          # A throwaway container reachable only from this job's runner.
          ORACLE_PASSWORD: MiraCi_sys_2026
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      # The test schema's pool: fromEnv() → appDb, by the PDB's service name (see matrix.connect).
      MIRA_DB_USER: MIRA
      MIRA_DB_PASSWORD: MiraCi_app_2026
      MIRA_DB_CONNECT_STRING: ${{ matrix.connect == 'easy' && 'localhost:1521/FREEPDB1' || '(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=localhost)(PORT=1521))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=FREEPDB1)(FAILOVER_MODE=(TYPE=SELECT)(METHOD=BASIC)(RETRIES=180)(DELAY=5))))' }}
      MIRA_DB_POOL_MIN: "5"
      MIRA_DB_POOL_MAX: "20"
      MIRA_DB_QUEUE_MAX: "40"
      MIRA_DB_POOL_TIMEOUT: "30"
      # The simulation's schema; it connects through MIRA_DB_CONNECT_STRING too.
      MIRA_SIM_DB_USERNAME: MIRA_SIM
      MIRA_SIM_DB_PASSWORD: MiraCi_app_2026
      MIRA_SIM_GRANTEE: MIRA
      # Thick mode runs every database call on a native worker thread. A call waiting
      # on a row lock holds its thread, so with fewer threads than such calls the lock
      # holder never gets one to commit and the client hangs (seen on this 4-core
      # runner: "concurrent transfers" ran 8 at once). node-oracledb's advice: at
      # least as many threads as pooled connections. Thin mode is unaffected.
      UV_THREADPOOL_SIZE: "32"
      # Runners are on UTC, where a session that ignores the configured time zone still looks
      # right. Run in +08:00 (no daylight saving) so a Date that moves by the machine's offset
      # fails the time-zone tests (Thick mode under Bun did, unseen, until 3.0).
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      - name: Prepare the database (MIRA and MIRA_SIM schemas)
        env:
          ORACLE: ${{ job.services.oracle.id }}
        run: |
          docker cp .github/oracle/setup-users.sql "$ORACLE":/tmp/setup-users.sql
          docker exec "$ORACLE" sqlplus -s / as sysdba @/tmp/setup-users.sql "$MIRA_DB_PASSWORD"

      - name: Install Oracle Instant Client (Thick mode)
        if: matrix.driver == 'thick'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libaio1t64 unzip
          # Instant Client looks for libaio.so.1; Ubuntu 24.04 ships it as libaio.so.1t64.
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          # Pinned build + checksum (the unversioned "latest" link is rebuilt in place).
          curl -sSLo /tmp/ic.zip https://download.oracle.com/otn_software/linux/instantclient/2326200/instantclient-basiclite-linux.x64-23.26.2.0.0.zip
          echo "c5e97765e633ad02597b8274c35efe5c10bd249a3285e34ee58fa7b318243225  /tmp/ic.zip" | sha256sum -c -
          sudo unzip -q /tmp/ic.zip -d /opt/oracle
          IC_DIR=$(ls -d /opt/oracle/instantclient_*)
          # On Linux the client is found through the library path (configureDriver's default).
          echo "LD_LIBRARY_PATH=$IC_DIR" >> "$GITHUB_ENV"

      - name: Test suite (with coverage)
        run: bun run test:coverage

      - name: Driver mode check
        run: |
          # The driver initialises lazily (2.2); initDriver() does it now and reports the mode.
          bun -e 'const { initDriver } = require("./src"); const { mode } = initDriver(); console.log("driver mode:", mode); if (mode !== process.env.EXPECTED_MODE) process.exit(1); process.exit(0);'
        env:
          EXPECTED_MODE: ${{ matrix.driver }}

      - name: Simulation
        run: bun run sim

      - name: Node smoke test (the npm build under Node)
        run: |
          bun run build
          node test/node/smoke.cjs

      - name: Package check (the packed tarball in an empty project)
        # Strict tsc over the published .d.ts, then TypeScript under Bun and CommonJS / ES
        # modules under Node, with no .env and no MIRA_* variables (see test/package/run.sh).
        run: bun run test:package
